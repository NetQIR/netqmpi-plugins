# Builds netqmpi-plugins and uploads it to PyPI when a GitHub release is
# published, with PyPI trusted publishing (no token stored in the repository).
# One-time setup on PyPI: add a (pending) trusted publisher for the project
# netqmpi-plugins with owner NetQIR, repository netqmpi-plugins, workflow
# publish.yml and environment pypi.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1; }

      # The plugins need SquidASM and NetSquid from the private NetSquid index,
      # so the tests do not run here; this only checks that the wheel installs
      # and registers its entry points.
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          netqmpi --list-plugins | tee plugins.txt
          grep -q nv_2026 plugins.txt && grep -q snv_2026 plugins.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/netqmpi-plugins/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
