# NetQMPI configuration: NV-centre QPUs with the COMPUTAEX 2026 parameters.
#
# The parameters are the preset nv_2026 shipped with the plugin
# (src/netqmpi_colorcenters/presets/nv_2026.yaml); this file only picks it and
# sets what NetQMPI itself needs for this platform.
#
#   netqmpi -n 2 examples/dega.py --netqasm --config examples/nv_2026.yaml

shots: 200               # ~0.5 s per shot with two ranks; override with --shots

netqasm:
  formalism: dm          # as the NetSquid emulator (primitives.py sets QFormalism.DM)
  num_qubits: 3          # electron + 2 nuclear spins, i.e. NVProcessor2026(3)
  plugin: netqmpi_colorcenters:nv_2026

  # Optional overrides of the preset, block by block:
  # plugin_config:
  #   device:
  #     electron_T2: 2.0e+9  # replaces this one value
  #   link: null             # NetQMPI's own links instead of the heralded ones
